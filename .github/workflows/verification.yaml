name: Development Verification

on:
  pull_request:
    branches:
      - master
      - release
  push:
    branches:
      - master
      - release

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

# Keep local profiles unchanged; every CI Cargo invocation uses compact artifacts.
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

# Only default-branch pushes populate caches. PR and release runs consume them.
jobs:
  static:
    name: Static contracts and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      platform_matrix: ${{ steps.plan.outputs.platform_matrix }}
      needs_webui: ${{ steps.plan.outputs.needs_webui }}
      bundles: ${{ steps.plan.outputs.bundles }}
      runtime_image: ${{ steps.plan.outputs.runtime_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          # The Linux owner installs mise.ci.toml's union for downstream consumers.
          cache-mode: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'read-write' || 'read-only' }}
      - run: mise exec -- just verify static
      - id: plan
        run: mise exec -- just release plan --format github-output

  ts:
    name: TypeScript and WebUI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          extra-tools: ''
      - run: mise exec -- just verify ts
      - name: Stage verified WebUI
        if: github.event_name == 'push' && github.ref == 'refs/heads/release' && needs.static.outputs.needs_webui == 'true'
        run: mise exec -- just release stage webui temp/release-inputs/webui-release-input
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/release' && needs.static.outputs.needs_webui == 'true'
        with:
          name: webui-release-input
          path: temp/release-inputs/webui-release-input
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  rust:
    name: Rust workspace and browser integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
          extra-tools: rust cmake
          browser-cache-mode: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'read-write' || 'read-only' }}
      - uses: ./.github/actions/setup-rust-cache
        with:
          shared-key: recorder-${{ runner.os }}-${{ runner.arch }}-debug
          cache-mode: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'read-write' || 'read-only' }}
      - run: mise exec -- just verify rust
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: temp/verification/browser
          if-no-files-found: warn

  platforms:
    name: Artifacts (${{ matrix.os }}, ${{ matrix.target }})
    needs: static
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.static.outputs.platform_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v4
      # Linux consumers wait for static's tool/store cache. Each additional OS
      # has one native owner, while Cargo profiles remain target-specific.
      - uses: ./.github/actions/setup
        with:
          extra-tools: rust cmake cargo:cargo-about
          cache-mode: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.cache_mode || 'read-only' }}
      - uses: ./.github/actions/setup-rust-cache
        with:
          shared-key: recorder-${{ matrix.target }}-release
          cache-mode: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'read-write' || 'read-only' }}
      - name: Tooling on additional host systems
        if: runner.os != 'Linux'
        run: mise exec -- just test tooling
      - id: platform-check
        run: mise exec -- just platform-check --target ${{ matrix.target }}
      - name: Stage verified executable
        if: github.event_name == 'push' && github.ref == 'refs/heads/release' && (needs.static.outputs.bundles == 'true' || (needs.static.outputs.runtime_image == 'true' && matrix.target == 'x86_64-unknown-linux-musl'))
        run: mise exec -- just release stage recorder temp/release-inputs/recorder-release-input-${{ matrix.target }} --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/release' && (needs.static.outputs.bundles == 'true' || (needs.static.outputs.runtime_image == 'true' && matrix.target == 'x86_64-unknown-linux-musl'))
        with:
          name: recorder-release-input-${{ matrix.target }}
          path: temp/release-inputs/recorder-release-input-${{ matrix.target }}
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      - name: Retain artifact receipts
        if: always() && steps.platform-check.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: media-${{ matrix.os }}-${{ matrix.target }}
          path: temp/verification/${{ matrix.target }}
          if-no-files-found: error

  verification-report:
    name: Verification report
    if: always()
    needs: [static, ts, rust, platforms]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification stage
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TS_RESULT: ${{ needs.ts.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          PLATFORMS_RESULT: ${{ needs.platforms.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$TS_RESULT" = success
          test "$RUST_RESULT" = success
          test "$PLATFORMS_RESULT" = success

  dispatch-release:
    name: Dispatch verified release candidate
    needs: verification-report
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          extra-tools: ''
      - run: mise exec -- just release dispatch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
