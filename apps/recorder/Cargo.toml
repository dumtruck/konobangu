[package]
name = "recorder"
version = "0.1.0"
edition = "2024"
autotests = false
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

license = "MIT"
repository = "https://github.com/apeiraco/konobangu"
publish = false
[features]
default = ["jxl"]
playground = ["test-utils"]
testcontainers = [
  "dep:testcontainers",
  "dep:testcontainers-modules",
  "dep:testcontainers-ext",
  "dep:bollard",
  "downloader/testcontainers",
  "testcontainers-modules/postgres",
]
jxl = ["dep:jpxl", "dep:jpxl-encode-policy"]
tracing-test = ["dep:tracing-test"]
test-utils = ["tracing-test", "dep:mockito", "dep:tracing-tree"]

[lib]
name = "recorder"
path = "src/lib.rs"


[[bin]]
name = "recorder-cli"
path = "src/bin/main.rs"
required-features = []

[[bin]]
name = "testcontainers-prune"
path = "src/bin/testcontainers-prune.rs"
required-features = ["testcontainers"]

[[bin]]
name = "auth-test-server"
path = "tests/e2e/support/auth_test_server.rs"
required-features = ["testcontainers", "test-utils"]
test = false

[[example]]
name = "mikan_collect_classic_eps"
path = "examples/mikan_collect_classic_eps.rs"
required-features = ["playground"]

[[example]]
name = "mikan_doppel_season_subscription"
path = "examples/mikan_doppel_season_subscription.rs"
required-features = ["playground"]

[[example]]
name = "mikan_doppel_subscriber_subscription"
path = "examples/mikan_doppel_subscriber_subscription.rs"
required-features = ["playground"]

[[example]]
name = "playground"
path = "examples/playground.rs"
required-features = ["playground"]

[[bin]]
name = "media-backfill"
path = "src/bin/media-backfill.rs"

[[example]]
name = "media_bench"
path = "examples/media_bench.rs"
required-features = ["jxl"]

[dependencies]
libmacaroon = { version = "0.3", default-features = false, features = ["v2json"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "chrono", "uuid", "json"] }
downloader = { workspace = true }
util = { workspace = true }
fetch = { workspace = true }
animeta = { workspace = true }
konobangu-configuration = { workspace = true }
konobangu-database = { workspace = true }
konobangu-auth-provider = { workspace = true }

serde = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }
testcontainers-ext = { workspace = true, optional = true, features = [
  "tracing",
] }
bollard = { version = "0.20.2", optional = true }
tracing = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
snafu = { workspace = true }
itertools = { workspace = true }
url = { workspace = true }
regex = { workspace = true }
lazy_static = { workspace = true }
quirks_path = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
serde_with = { workspace = true }
moka = { workspace = true }
chrono = { workspace = true }
tracing-subscriber = { workspace = true }
mockito = { workspace = true, optional = true }
convert_case = { workspace = true }
image = { workspace = true }
png = "=0.18.1"
uuid = { workspace = true }
maplit = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
rust_decimal = { workspace = true }
base64 = { workspace = true }
nom = { workspace = true }
percent-encoding = { workspace = true }
num-traits = { workspace = true }
http = { workspace = true }
async-stream = { workspace = true }
serde_variant = { workspace = true }
tracing-appender = { workspace = true }
clap = { workspace = true }
ipnetwork = { workspace = true }
typed-builder = { workspace = true }
webp = { workspace = true }
tracing-test = { workspace = true, optional = true }

sea-orm = { version = "=2.0.4", features = [
  "sqlx-postgres",
  "runtime-tokio",
  "macros",
  "debug-print",
  "seaography",
  "with-json",
] }
figment = { version = "0.10", features = ["toml", "json", "env", "yaml"] }
sea-orm-migration = { version = "=2.0.4", default-features = false, features = ["runtime-tokio", "sqlx-postgres"] }
rss = { version = "2", features = ["builders", "with-serde"] }
fancy-regex = "0.19"
lightningcss = "1.0.0-alpha.72"
html-escape = "0.2.15"
opendal = { version = "0.59", features = ["default", "services-fs"] }
scraper = "0.27"
async-graphql = { version = "7", features = ["dynamic-schema"] }
async-graphql-axum = "7"
seaography = { version = "=2.0.0-rc.9", features = [
  "with-json",
  "with-chrono",
  "with-time",
  "with-uuid",
  "with-decimal",
  "with-bigdecimal",
  "with-postgres-array",
] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7", features = [
  "trace",
  "catch-panic",
  "timeout",
  "add-extension",
  "cors",
  "fs",
  "set-header",
  "compression-full",
] }
dotenvy = "0.15.7"
sha2 = "0.10.9"
mediatype = "=0.21.0"
http-range = "=0.1.5"
tempfile = "=3.27.0"

apalis = { version = "=1.0.0-rc.10", features = ["limit", "tracing", "catch-panic"] }
apalis-postgres = { version = "=1.0.0-rc.9", features = ["tokio-comp", "migrate"] }
cocoon = { version = "0.5", features = ["getrandom", "thiserror"] }
reqwest_cookie_store = "0.10"
mime_guess = "2.0.5"
icu_properties = "2.3"
icu = "2.3"
tracing-tree = { version = "0.4.1", optional = true }
num_cpus = "1.17.0"
headers-accept = "0.3"
quick-xml = { version = "0.42", features = [
  "serialize",
  "serde-types",
  "serde",
] }
croner = "4"
ts-rs = "12"
paste = "1.0.15"
chrono-tz = "0.10.4"
securitydept-oauth-resource-server = { version = "=0.3.3", default-features = false }
securitydept-token-set-context = { version = "=0.3.3", default-features = false }
securitydept-creds = { version = "=0.3.3", default-features = false, features = ["rfc9068"] }
securitydept-utils = { version = "=0.3.3", default-features = false }

[dev-dependencies]
tracing-log = "0.2"
sysinfo = { version = "0.39.6", features = ["system"] }
mockito = { workspace = true }
tracing-tree = "0.4.1"
# Only the classic-episode export example uses dataframe/CSV/Parquet support.
polars = { version = "0.55", default-features = false, features = ["csv", "parquet", "diagonal_concat"] }
jxl = "=0.7.4"
inquire = { workspace = true }
color-eyre = { workspace = true }
insta = { version = "1", features = ["redactions", "toml", "filters"] }

serial_test = { workspace = true }
rstest = { workspace = true }

# Test target names remain stable for Cargo/Just filters.
[[test]]
name = "rls"
path = "tests/integration/rls.spec.rs"
required-features = ["testcontainers", "test-utils"]

[[test]]
name = "config_media"
path = "tests/integration/config_media.spec.rs"

[[test]]
name = "config_secrets"
path = "tests/integration/config_secrets.spec.rs"

[[test]]
name = "media_executor"
path = "tests/integration/media_executor.spec.rs"

[[test]]
name = "media_http"
path = "tests/integration/media_http.spec.rs"

[[test]]
name = "media_delivery"
path = "tests/integration/media_delivery.spec.rs"
required-features = ["test-utils"]

[[test]]
name = "mod"
path = "tests/integration/migrations.test.rs"

[dependencies.jpxl]
git = "https://github.com/liminalism/JPXL"
rev = "1e2004aa0672259279cc24a52d4b8e264f675b77"
optional = true

[dependencies.jpxl-encode-policy]
git = "https://github.com/liminalism/JPXL"
rev = "1e2004aa0672259279cc24a52d4b8e264f675b77"
default-features = false
features = ["g5-bounded-entropy", "one-shot-controller", "corrected-stop", "flagged-median-start", "reserve-coupled-band", "case-predictor"]
optional = true

[dependencies.rayon]
version = "1.11.0"

[[example]]
name = "media_browser_server"
path = "examples/media_browser_server.rs"
required-features = ["jxl", "test-utils"]

[lints]
workspace = true
