  - vitest@5.0.2
  - '@securitydept/client-react@0.3.2 || 0.3.3'
  - '@securitydept/client@0.3.2 || 0.3.3'
  - '@securitydept/token-set-context-client-react@0.3.2 || 0.3.3'
  - '@securitydept/token-set-context-client@0.3.2 || 0.3.3'
overrides:
  codemirror-graphql>@codemirror/language: "^6.12.4"
